<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VV Jailbreak Repository</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:980px;margin:0 auto;padding:32px 18px;background:#f5f5f7;color:#111}
.card{background:#fff;border-radius:18px;padding:22px;margin:16px 0;box-shadow:0 5px 20px #00000012}
input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #ddd;border-radius:12px;font-size:16px}
.item{padding:14px 0;border-bottom:1px solid #eee}.item:last-child{border:0}
a{color:#06c;text-decoration:none}.muted{color:#777}
code{background:#eee;padding:3px 6px;border-radius:6px}
</style>
</head>
<body>
<div class="card">
<h1>VV Jailbreak Repository</h1>
<p class="muted">APT repository for iOS jailbreak packages.</p>
<p><code>https://fatekingcsr.github.io/VV/</code></p>
<input id="q" placeholder="Search packages..." oninput="render()">
</div>
<div class="card"><div id="list">Loading...</div></div>
<script>
let data=[];
fetch('./packages.json').then(r=>r.json()).then(x=>{data=x;render()}).catch(()=>document.getElementById('list').textContent='No package catalog yet.');
function render(){
 const q=(document.getElementById('q').value||'').toLowerCase();
 const out=data.filter(p=>(p.name+' '+p.package+' '+p.description).toLowerCase().includes(q));
 document.getElementById('list').innerHTML=out.length?out.map(p=>`
 <div class="item">
 <h3>${esc(p.name||p.package)}</h3>
 <div>Version: ${esc(p.version||'')} · Architecture: ${esc(p.architecture||'')}</div>
 <p class="muted">${esc(p.description||'')}</p>
 ${p.filename?`<a href="${esc(p.filename)}">Download .deb</a>`:''}
 </div>`).join(''):'No packages found.';
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
</script>
</body>
</html>
